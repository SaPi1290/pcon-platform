---
- name: Dienste neu starten
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate --remove-orphans
    chdir: "{{ gitea_dir }}"
  changed_when: true

- name: Caddy neu laden
  ansible.builtin.command:
    cmd: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
    chdir: "{{ gitea_dir }}"
  changed_when: true
